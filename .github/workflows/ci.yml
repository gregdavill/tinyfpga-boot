name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fresh push doesn't queue
# behind an outdated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the dev shell once and populate the store cache, so the jobs
  # below (which `needs:` this) restore it instead of each rebuilding it
  # from scratch in parallel on a cold cache.
  setup:
    name: Warm Nix cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c true   # realise the dev shell into /nix/store

  # Synthesise + place & route each board's bitstream.
  gateware:
    name: Build gateware (${{ matrix.board }}, ${{ matrix.backend }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: tinyfpga_bx, backend: all }
          - { board: orangecrab,  backend: all }
          - { board: ecpbreaker,  backend: all }
          - { board: butterstick, backend: all }
          # UP5K targets only build as uf2 + dfu composite for space
          - { board: fomu-evt,    backend: "uf2,dfu" }
          - { board: fomu-hacker, backend: "uf2,dfu" }
          - { board: fomu-pvt,    backend: "uf2,dfu" }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c python build.py --board ${{ matrix.board }} --backend ${{ matrix.backend }}
      - uses: actions/upload-artifact@v6
        with:
          name: gateware-${{ matrix.board }}-${{ matrix.backend }}
          # iCE40 emits top.bin (+ multiboot.bin); ECP5 emits top.bit.
          path: |
            build/top.bin
            build/top.bit
            build/multiboot.bin
          if-no-files-found: warn

  # End-to-end cocotb integration regressions (both backends + serial sources).
  integration:
    name: cocotb integration regressions
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup-nix
      - name: Run cocotb suite
        run: |
          nix develop -c bash -c 'cd tests/sim && make'
          nix develop -c bash -c 'cd tests/sim && make SERIAL_SOURCE=security_page'
          nix develop -c bash -c 'cd tests/sim && make TARGET=hs'
          nix develop -c bash -c 'cd tests/sim && make BACKEND=serial'
          nix develop -c bash -c 'cd tests/sim && make BACKEND=dfu'

          # Auto-boot:
          nix develop -c bash -c 'cd tests/sim && make AUTOBOOT=1'
          nix develop -c bash -c 'cd tests/sim && make AUTOBOOT=1 COCOTB_TEST_FILTER=test_no_valid_app_stays'
          nix develop -c bash -c 'cd tests/sim && make AUTOBOOT=1 COCOTB_TEST_FILTER=test_write_enable_latch_stays'
          nix develop -c bash -c 'cd tests/sim && make AUTOBOOT=1 COCOTB_TEST_FILTER=test_button_held_stays'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: |
            tests/sim/build/coverage_report.txt
            tests/sim/build/coverage_report.yaml
          if-no-files-found: warn

  # Block-level unit tests.
  blocks:
    name: Block-level unit tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c python -m unittest discover -v -s tests/unit -t .

  formal:
    name: Formal verification
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c bash -c 'cd tests/formal && make'
